botFlow:
  name: {{BOTFLOW_NAME}}
  description: Bot Flow for Polly
  division: {{DIVISION_NAME}}
  startUpRef: "/botFlow/bots/bot[Default Bot_10]"
  defaultLanguage: de-de
  supportedLanguages:
    de-de:
      defaultLanguageSkill:
        noValue: true
      speechToText:
        engine:
          name: Microsoft Azure
          defaultEngine: true
  variables:
    - stringVariable:
        name: Flow.data_table_value
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.data_table_value_draft
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.data_table_value_prod
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.data_table_value_stage
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - booleanVariable:
        name: Flow.flow_is_finished
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.flow_next_question_id
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.flow_rating_values
        initialValue:
          lit:
            - lit: "0"
            - lit: "1"
            - lit: "2"
            - lit: "3"
            - lit: "4"
            - lit: "5"
            - lit: "6"
            - lit: "7"
            - lit: "8"
        isInput: false
        isOutput: false
    - jsonVariable:
        name: Flow.flow_reporting_question_result
        initialValue:
          lit: "{}"
        isInput: false
        isOutput: false
    - jsonCollectionVariable:
        name: Flow.flow_reporting_question_results
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - jsonVariable:
        name: Flow.flow_reporting_result
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.inbound_called_address
        initialValue:
          noValue: true
        isInput: true
        isOutput: false
    - stringVariable:
        name: Flow.inbound_queue_name
        initialValue:
          noValue: true
        isInput: true
        isOutput: false
    - stringVariable:
        name: Flow.inbound_test
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - integerVariable:
        name: Flow.loop_counter
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.mapped_survey_id
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - jsonVariable:
        name: Flow.question
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_answer
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_default_next_id
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_id
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.question_labels
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - integerVariable:
        name: Flow.question_loop_counter
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - booleanVariable:
        name: Flow.question_mandatory
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_name
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_prompt
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_reprompt
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringCollectionVariable:
        name: Flow.question_synonyms
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.question_type
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - jsonVariable:
        name: Flow.survey
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_closing
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_created_at
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_description
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_greeting
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_id
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_name
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - integerVariable:
        name: Flow.survey_question_count
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - jsonCollectionVariable:
        name: Flow.survey_questions
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_title
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_updated_at
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Flow.survey_version
        initialValue:
          noValue: true
        isInput: false
        isOutput: false
    - stringVariable:
        name: Slot.choice
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.choice_type_test
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.comment
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.nps
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
    - stringVariable:
        name: Slot.rating
        initialValue:
          noValue: true
        isInput: true
        isOutput: true
  settingsActionDefaults:
    askForIntent:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForSlot:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    askForBoolean:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
    loopAnythingElse:
      voiceEndOfInputTimeout:
        lit:
          seconds: 1
  settingsErrorHandling:
    errorHandling:
      exit:
        none: true
    enableAgentEscalation:
      lit: true
    errorEventHandover:
      exp: "MakeCommunication(\n  \"Leider ist ein Fehler aufgetreten. Bitte warten Sie kurz, ich werde Sie zu einer Person durchstellen, die Ihnen helfen kann.\")"
    agentEscalationConfirmation:
      exp: "MakeCommunication(\n  \"Sie möchten mit einem Berater sprechen. Ist das richtig?\")"
    agentEscalationHandover:
      exp: "MakeCommunication(\n  \"Bitte warten Sie kurz, ich werde Sie durchstellen.\")"
    recognitionFailureEventHandover:
      exp: "MakeCommunication(\n  \"Ich kann Sie leider nur schlecht verstehen. Bitte warten Sie kurz, ich werde Sie zu einer Person durchstellen, die Ihnen helfen kann.\")"
    recognitionFailureEventHandling:
      exit:
        none: true
    agentEscalationHandling:
      exit:
        none: true
  settingsPrompts:
    ensureAudioInPrompts: false
    promptMediaToValidate:
      - mediaType: audio
      - mediaType: tts
  tasks:
    - task:
        name: yes_no_question
        refId: yes_no_question_15
        actions:
          - updateData:
              name: update data before yes-no question
              statements:
                - string:
                    variable: Flow.flow_next_question_id
                    value:
                      exp: Flow.question_default_next_id
                - json:
                    variable: Flow.flow_reporting_question_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_question_result, "id", Flow.question_id)
                - json:
                    variable: Flow.flow_reporting_question_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_question_result, "name", Flow.question_name)
                - string:
                    variable: Flow.question_answer
                    value:
                      exp: NOT_SET
          - askForBoolean:
              name: ask for yes-no
              question:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_prompt))"
              noInput:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              noMatch:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              voiceEndOfInputTimeout:
                noValue: true
              outputs:
                "yes":
                  actions:
                    - updateData:
                        name: update after yes-no after yes
                        statements:
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if (ToString(Flow.question.options.yes_next_question_id) == \"null\", \n      Flow.question_default_next_id\n      ,\n      ToString(Flow.question.options.yes_next_question_id)\n)"
                          - json:
                              variable: Flow.flow_reporting_question_result
                              value:
                                exp: SetJsonObjectProperty(Flow.flow_reporting_question_result, "result", "yes")
                          - string:
                              variable: Flow.question_answer
                              value:
                                lit: yes
                "no":
                  actions:
                    - updateData:
                        name: update after yes-no after no
                        statements:
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if (ToString(Flow.question.options.no_next_question_id) == \"null\", \n      Flow.question_default_next_id\n      ,\n      ToString(Flow.question.options.no_next_question_id)\n)"
                          - json:
                              variable: Flow.flow_reporting_question_result
                              value:
                                exp: SetJsonObjectProperty(Flow.flow_reporting_question_result, "result", "no")
                          - string:
                              variable: Flow.question_answer
                              value:
                                lit: no
                maxNoInputs:
                  enabled: true
                  actions:
                    - callTask:
                        name: Call Task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                maxNoMatches:
                  enabled: true
                  actions:
                    - callTask:
                        name: Call Task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
          - updateData:
              name: Update Data after yesno question
              statements:
                - string:
                    variable: Flow.flow_next_question_id
                    value:
                      exp: "if (Flow.flow_next_question_id == \"null\",\n\tNOT_SET\n\t,\n\tFlow.flow_next_question_id\n)"
          - endTask:
              name: End Task
              outputPath:
                name: default
    - task:
        name: goodbye_and_exit
        refId: goodbye_and_exit_17
        actions:
          - communicate:
              name: goodbye prompt
              communication:
                exp: "MakeCommunication(\n  \"Vielen Dank, dass sie sich Zeit für uns genommen haben.\")"
          - exitBotFlow:
              name: Exit Bot Flow
    - task:
        name: question_loop
        refId: question_loop_29
        actions:
          - loop:
              name: Question Loop
              currentIndex:
                var: Flow.question_loop_counter
              loopCount:
                exp: Flow.survey_question_count
              outputs:
                loop:
                  actions:
                    - updateData:
                        name: Update Data
                        statements:
                          - json:
                              variable: Flow.question
                              value:
                                exp: Flow.survey_questions[Flow.question_loop_counter]
                    - decision:
                        name: Decision
                        condition:
                          exp: ToString(Flow.question.id) == Flow.flow_next_question_id
                        outputs:
                          "yes":
                            actions:
                              - loopExit:
                                  name: Exit Loop
          - endTask:
              name: End Task
              outputPath:
                name: default
    - task:
        name: rating_question
        refId: rating_question_46
        variables:
          - stringVariable:
              name: Task.rating_equals_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.rating_equals_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.rating_greater_than_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.rating_greater_than_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.rating_less_than_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.rating_less_than_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.rating_max_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.rating_min_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - updateData:
              name: update data before rating question
              statements:
                - integer:
                    variable: Task.rating_min_value
                    value:
                      exp: ToInt(Flow.question.options.min_value)
                - integer:
                    variable: Task.rating_max_value
                    value:
                      exp: ToInt(Flow.question.options.max_value)
                - integer:
                    variable: Task.rating_equals_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[0].value)
                - integer:
                    variable: Task.rating_less_than_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[1].value)
                - integer:
                    variable: Task.rating_greater_than_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[2].value)
                - string:
                    variable: Task.rating_equals_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[0].next_question_id)
                - string:
                    variable: Task.rating_less_than_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[1].next_question_id)
                - string:
                    variable: Task.rating_greater_than_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[2].next_question_id)
                - stringCollection:
                    variable: Flow.flow_rating_values
                    value:
                      exp: "Split(\n  Replace(\n    Replace(\n      Replace(\n        ToString(GetJsonObjectProperty(Flow.question.options, \"values\")), \n        \"[\", \"\"\n      ), \n      \"]\", \"\"\n    ), \n    \"\\\"\", \"\"\n  ), \n  \",\"\n)"
                - string:
                    variable: Flow.question_answer
                    value:
                      exp: NOT_SET
          - askForSlot:
              name: ask for rating
              slot:
                name: rating
              question:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_prompt))"
              customValidation:
                noValue: true
              confirmationMode:
                lit: never
              noInput:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              noMatch:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              voiceEndOfInputTimeout:
                noValue: true
              outputs:
                default:
                  actions:
                    - updateData:
                        name: update after rating question
                        statements:
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if (ToInt(Slot.rating) == ToInt(Task.rating_equals_value),\n    Task.rating_equals_next_question_id\n    ,\n    if (ToInt(Slot.rating) < ToInt(Task.rating_less_than_value),\n        Task.rating_less_than_next_question_id\n        ,\n        if (ToInt(Slot.rating) > ToInt(Task.rating_greater_than_value),\n            Task.rating_greater_than_next_question_id\n            ,\n            Flow.question_default_next_id\n        )\n    )\n)"
                          - string:
                              variable: Flow.question_answer
                              value:
                                exp: Slot.rating
                maxNoInputs:
                  enabled: true
                  actions:
                    - callTask:
                        name: call Task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                maxNoMatches:
                  enabled: true
                  actions:
                    - callTask:
                        name: call Task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                skipResponseCapture:
                  enabled: false
          - endTask:
              name: End Rating Task
              outputPath:
                name: default
    - task:
        name: choice_question
        refId: choice_question_50
        variables:
          - stringVariable:
              name: Task.choice_default_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.choice_label_index
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringCollectionVariable:
              name: Task.choice_next_question_ids
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - updateData:
              name: update data before choice question
              statements:
                - string:
                    variable: Flow.question_answer
                    value:
                      exp: NOT_SET
                - stringCollection:
                    variable: Task.choice_next_question_ids
                    value:
                      exp: "Split(\n  Replace(\n    Replace(\n      Replace(\n        ToString(GetJsonObjectProperty(Flow.question, \"next_question_ids\")), \n        \"[\", \"\"\n      ), \n      \"]\", \"\"\n    ), \n    \"\\\"\", \"\"\n  ), \n  \",\"\n)"
                - string:
                    variable: Task.choice_default_next_question_id
                    value:
                      exp: Flow.question_default_next_id
                - stringCollection:
                    variable: Flow.question_labels
                    value:
                      exp: "Split(\n  Replace(\n    Replace(\n      Replace(\n        ToString(GetJsonObjectProperty(Flow.question, \"labels\")), \n        \"[\", \"\"\n      ), \n      \"]\", \"\"\n    ), \n    \"\\\"\", \"\"\n  ), \n  \",\"\n)"
                - stringCollection:
                    variable: Flow.question_synonyms
                    value:
                      exp: "Split(\n  Replace(\n    Replace(\n      Replace(\n        Replace(\n          Replace(\n            ToString(GetJsonObjectProperty(Flow.question, \"synonyms\")),\n            \"[\", \"\"\n          ), \n          \"]\", \"\"\n        ), \n        \"\\\"\", \"\"\n      ),\n      \",\", \"|\"\n    ),\n    \";\", \",\"\n  ), \n  \"|\"\n)"
          - askForSlot:
              name: ask choice
              slot:
                name: choice
              question:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_prompt))"
              customValidation:
                noValue: true
              confirmationMode:
                lit: never
              customizeNoInput:
                noInputReprompts:
                  lit: []
              noMatch:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              voiceEndOfInputTimeout:
                noValue: true
              outputs:
                default:
                  actions:
                    - updateData:
                        name: udate data after choice question
                        statements:
                          - integer:
                              variable: Task.choice_label_index
                              value:
                                exp: FindFirst(Flow.question_labels, Slot.choice)
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if(Task.choice_next_question_ids[Task.choice_label_index] == \"null\"\n\t, \n\tNOT_SET\n\t, \n\tTask.choice_next_question_ids[Task.choice_label_index]\n)"
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if(IsNotSetOrEmpty(Flow.flow_next_question_id), \n\tFlow.question_default_next_id\n\t, \n\tFlow.flow_next_question_id\n)\n"
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if(IsNotSetOrEmpty(Flow.flow_next_question_id)\n\t,\n\tNOT_SET\n\t, \n\tFlow.flow_next_question_id\n)"
                          - string:
                              variable: Flow.question_answer
                              value:
                                exp: Slot.choice
                maxNoInputs:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                maxNoMatches:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                skipResponseCapture:
                  enabled: false
          - endTask:
              name: End Task
              outputPath:
                name: default
    - task:
        name: nps_question
        refId: nps_question_53
        variables:
          - stringVariable:
              name: Task.nps_equals_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.nps_equals_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.nps_greater_than_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.nps_greater_than_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - stringVariable:
              name: Task.nps_less_than_next_question_id
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
          - integerVariable:
              name: Task.nps_less_than_value
              initialValue:
                noValue: true
              isInput: false
              isOutput: false
        actions:
          - updateData:
              name: update data before nps question
              statements:
                - string:
                    variable: Flow.question_answer
                    value:
                      exp: NOT_SET
                - integer:
                    variable: Task.nps_equals_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[0].value)
                - integer:
                    variable: Task.nps_less_than_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[1].value)
                - integer:
                    variable: Task.nps_greater_than_value
                    value:
                      exp: ToInt(Flow.question.conditional_next_question[2].value)
                - string:
                    variable: Task.nps_equals_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[0].next_question_id)
                - string:
                    variable: Task.nps_less_than_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[1].next_question_id)
                - string:
                    variable: Task.nps_greater_than_next_question_id
                    value:
                      exp: ToString(Flow.question.conditional_next_question[2].next_question_id)
          - askForSlot:
              name: ask for nps
              slot:
                name: nps
              question:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_prompt))"
              customValidation:
                noValue: true
              confirmationMode:
                lit: never
              noInput:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              noMatch:
                exp: "MakeCommunication(\n  ToCommunication(Flow.question_reprompt))"
              voiceEndOfInputTimeout:
                noValue: true
              outputs:
                default:
                  actions:
                    - updateData:
                        name: update data after NPS question
                        statements:
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if (Flow.question_default_next_id == \"null\",\n    NOT_SET\n    ,\n    Flow.question_default_next_id\n)"
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: "if (ToInt(Slot.nps) == ToInt(Task.nps_equals_value),\n    Task.nps_equals_next_question_id,\n    if (ToInt(Slot.nps) < ToInt(Task.nps_less_than_value),\n        Task.nps_less_than_next_question_id,\n        if (ToInt(Slot.nps) > ToInt(Task.nps_greater_than_value),\n            Task.nps_greater_than_next_question_id,\n            Flow.question_default_next_id\n        )\n    )\n)"
                          - string:
                              variable: Flow.question_answer
                              value:
                                exp: ToString(Slot.nps)
                maxNoInputs:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                maxNoMatches:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
