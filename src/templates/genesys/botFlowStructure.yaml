                          - string:
                              variable: Flow.question_answer
                              value:
                                exp: Slot.comment
                maxNoInputs:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                maxNoMatches:
                  enabled: true
                  actions:
                    - callTask:
                        name: call task check mandatory question
                        targetTaskRef: "/botFlow/tasks/task[check_mandatory_question_104]"
                skipResponseCapture:
                  enabled: false
          - endTask:
              name: End Task
              outputPath:
                name: default
    - task:
        name: check_mandatory_question
        refId: check_mandatory_question_104
        actions:
          - decision:
              name: Decision
              condition:
                exp: Flow.question_mandatory == true
              outputs:
                "yes":
                  actions:
                    - callTask:
                        name: Call Task
                        targetTaskRef: "/botFlow/tasks/task[goodbye_and_exit_17]"
                "no":
                  actions:
                    - updateData:
                        name: Update after rating NI
                        statements:
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: Flow.question_default_next_id
          - endTask:
              name: End Task
              outputPath:
                name: default
    - task:
        name: error_and_exit
        refId: error_and_exit_120
        actions:
          - communicate:
              name: Communicate
              communication:
                exp: "MakeCommunication(\n  \"Oh, da ist etwas schief gegangen.\")"
          - exitBotFlow:
              name: Exit Bot Flow
  settingsBotFlow:
    voiceProcessingPrompt:
      lit:
        name: PromptSystem.connecting_vibe
    initialPlaybackDelay:
      lit:
        ms: 250
    minimumPlaybackTime:
      lit:
        seconds: 1
    dynamicSlotTypes:
      - dynamicSlotType:
          name: choice_type
          values:
            exp: Flow.question_labels
          synonyms:
            exp: Flow.question_synonyms
      - dynamicSlotType:
          name: rating_type
          values:
            exp: Flow.flow_rating_values
          synonyms:
            noValue: true
      - dynamicSlotType:
          name: yes_no_type
          values:
            lit:
              - lit: ja
              - lit: nein
          synonyms:
            lit:
              - lit: yes, jo, jup, Genau, stimmt, klar, sicher, 1
              - lit: no, nop, nee, 2
  settingsUserInput:
    enableBargeIn:
      lit: true
    enableAutomaticQuickReplies:
      lit: true
    noMatchesMax:
      lit: 2
    noInputsMax:
      lit: 2
    noInputsTimeout:
      lit:
        seconds: 7
    speechToTextSpeechDetectionSensitivity:
      noValue: true
    speechToTextMaxSpeechTimeout:
      noValue: true
    speechToTextAdvancedConfiguration:
      noValue: true
    enableIntentClassificationHinting:
      lit: false
    interDigitTimeout:
      lit:
        seconds: 3
    dtmfTerminatingCharacter:
      noValue: true
    confirmationRejectionsMax:
      lit: 3
    collectionLowConfidenceThreshold:
      lit: 20
    collectionHighConfidenceThreshold:
      lit: 70
    confirmationLowConfidenceThreshold:
      lit: 40
    noMatchApology:
      exp: "MakeCommunication(\n  ToCommunication(NOT_SET))"
    noInputApology:
      exp: "MakeCommunication(\n  ToCommunication(NOT_SET))"
    noToConfirmationApology:
      exp: "MakeCommunication(\n  \"Mir ist ein Fehler unterlaufen.\")"
    confirmationNoMatchApology:
      exp: "MakeCommunication(\n  \"Bitte antworten Sie mit 'Ja' oder 'Nein'.\")"
    confirmationNoInputApology:
      exp: "MakeCommunication(\n  \"Ich habe Sie leider nicht gehört. Bitte antworten Sie mit 'Ja' oder 'Nein'.\")"
  settingsKnowledge:
    none: true
  bots:
    - bot:
        name: Default Bot
        refId: Default Bot_10
        actions:
          - updateData:
              name: Update Data
              statements:
                - string:
                    variable: Flow.inbound_called_address
                    value:
                      exp: if(IsNotSetOrEmpty(Flow.inbound_called_address), "+496956516", Flow.inbound_called_address)
          - dataTableLookup:
              name: Data Table Lookup
              lookupValue:
                exp: if(IsNotSetOrEmpty(Flow.inbound_queue_name), Flow.inbound_called_address, Flow.inbound_queue_name)
              dataTable:
                {{MAPPING_DATA_TABLE_NAME}}:
                  foundOutputs:
                    DeliveryRate:
                      noValue: true
                    SurveyId:
                      var: Flow.mapped_survey_id
                  failureOutputs:
                    errorType:
                      noValue: true
                    errorMessage:
                      noValue: true
              outputs:
                notFound:
                  actions:
                    - callTask:
                        name: Call Task
                        targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
                failure:
                  actions:
                    - callTask:
                        name: Call Task
                        targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
          - dataTableLookup:
              name: data table lookup
              lookupValue:
                exp: "\"survey_\" + Flow.mapped_survey_id"
              dataTable:
                {{DATA_TABLE_NAME}}:
                  foundOutputs:
                    Draft:
                      var: Flow.data_table_value_draft
                    Stage:
                      var: Flow.data_table_value_stage
                    Prod:
                      var: Flow.data_table_value_prod
                    Backup:
                      noValue: true
                    lock:
                      noValue: true
                  failureOutputs:
                    errorType:
                      noValue: true
                    errorMessage:
                      noValue: true
              outputs:
                found:
                  actions:
                    - updateData:
                        name: parse survey
                        statements:
                          - string:
                              variable: Flow.data_table_value
                              value:
                                exp: if(IsNotSetOrEmpty(Flow.inbound_queue_name), Flow.data_table_value_stage, Flow.data_table_value_prod)
                          - json:
                              variable: Flow.survey
                              value:
                                exp: ToJson(Flow.data_table_value)
                          - jsonCollection:
                              variable: Flow.survey_questions
                              value:
                                exp: ToJsonCollection(Flow.survey.questions)
                          - integer:
                              variable: Flow.survey_question_count
                              value:
                                exp: count(Flow.survey_questions)
                          - string:
                              variable: Flow.survey_id
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "id"))
                          - string:
                              variable: Flow.survey_title
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "title"))
                          - string:
                              variable: Flow.survey_name
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "name"))
                          - string:
                              variable: Flow.survey_description
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "description"))
                          - string:
                              variable: Flow.survey_greeting
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "greeting_prompt"))
                          - string:
                              variable: Flow.survey_closing
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "closing_prompt"))
                          - string:
                              variable: Flow.survey_created_at
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "created_at"))
                          - string:
                              variable: Flow.survey_updated_at
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "updated_at"))
                          - string:
                              variable: Flow.flow_next_question_id
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "start_question_id"))
                          - string:
                              variable: Flow.survey_version
                              value:
                                exp: ToString(GetJsonObjectProperty(Flow.survey, "version"))
                notFound:
                  actions:
                    - callTask:
                        name: call error task
                        targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
                failure:
                  actions:
                    - callTask:
                        name: call error task
                        targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
          - communicate:
              name: welcome
              communication:
                exp: "MakeCommunication(\n  ToCommunication(Flow.survey_greeting))"
          - updateData:
              name: init reporting
              statements:
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: "JsonParse(\n  \"{}\"\n)"
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "id", Flow.survey_id)
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "name", Flow.survey_name)
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "title", Flow.survey_title)
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "created_at", Flow.survey_created_at)
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "updated_at", Flow.survey_updated_at)
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "version", toInt(Flow.survey_version))
                - json:
                    variable: Flow.flow_reporting_result
                    value:
                      exp: SetJsonObjectProperty(Flow.flow_reporting_result, "question_results", Flow.flow_reporting_question_results)
          - setParticipantData:
              name: Set Participant Data
              attributes:
                - attribute:
                    name:
                      lit: reporting_results
                    value:
                      exp: ToString(Flow.flow_reporting_result)
          - loop:
              name: loop over questions
              currentIndex:
                var: Flow.loop_counter
              loopCount:
                exp: Flow.survey_question_count
              outputs:
                loop:
                  actions:
                    - callTask:
                        name: get question
                        targetTaskRef: "/botFlow/tasks/task[question_loop_29]"
                        outputs:
                          default:
                            actions:
                              - updateData:
                                  name: update question data
                                  statements:
                                    - string:
                                        variable: Flow.question_id
                                        value:
                                          exp: ToString(Flow.question.id)
                                    - string:
                                        variable: Flow.question_name
                                        value:
                                          exp: ToString(Flow.question.name)
                                    - string:
                                        variable: Flow.question_type
                                        value:
                                          exp: ToString(Flow.question.type)
                                    - string:
                                        variable: Flow.question_prompt
                                        value:
                                          exp: ToString(Flow.question.prompt)
                                    - string:
                                        variable: Flow.question_reprompt
                                        value:
                                          exp: ToString(Flow.question.reprompt)
                                    - boolean:
                                        variable: Flow.question_mandatory
                                        value:
                                          exp: ToBool(Flow.question.mandatory)
                                    - string:
                                        variable: Flow.question_default_next_id
                                        value:
                                          exp: ToString(Flow.question.default_next_question_id)
                    - switch:
                        name: question type switch
                        evaluate:
                          firstTrue:
                            default:
                              actions:
                                - callTask:
                                    name: comment
                                    targetTaskRef: "/botFlow/tasks/task[comment_question_81]"
                                    outputs:
                                      default:
                                        actions:
                                          - clearSlot:
                                              name: Clear Slot
                                              slots:
                                                - slot:
                                                    name: comment
                            cases:
                              - case:
                                  value:
                                    exp: Flow.question_type == "choice"
                                  actions:
                                    - callTask:
                                        name: choice
                                        targetTaskRef: "/botFlow/tasks/task[choice_question_50]"
                                        outputs:
                                          default:
                                            actions:
                                              - clearSlot:
                                                  name: Clear Slot
                                                  slots:
                                                    - slot:
                                                        name: choice
                              - case:
                                  value:
                                    exp: Flow.question_type == "rating"
                                  actions:
                                    - callTask:
                                        name: rating
                                        targetTaskRef: "/botFlow/tasks/task[rating_question_46]"
                                        outputs:
                                          default:
                                            actions:
                                              - clearSlot:
                                                  name: Clear Slot
                                                  slots:
                                                    - slot:
                                                        name: rating
                              - case:
                                  value:
                                    exp: Flow.question_type == "yes_no"
                                  actions:
                                    - callTask:
                                        name: yes no
                                        targetTaskRef: "/botFlow/tasks/task[yes_no_question_15]"
                              - case:
                                  value:
                                    exp: Flow.question_type == "nps"
                                  actions:
                                    - callTask:
                                        name: nps
                                        targetTaskRef: "/botFlow/tasks/task[nps_question_53]"
                                        outputs:
                                          default:
                                            actions:
                                              - clearSlot:
                                                  name: Clear Slot
                                                  slots:
                                                    - slot:
                                                        name: nps
                    - updateData:
                        name: update date after question
                        statements:
                          - boolean:
                              variable: Flow.flow_is_finished
                              value:
                                exp: IsNotSetOrEmpty(Flow.flow_next_question_id) or Flow.flow_next_question_id == "null"
                    - callData:
                        name: submit results
                        timeout:
                          lit:
                            minutes: 1
                        category:
                          {{INTEGRATION_NAME}}:
                            dataAction:
                              {{DATA_ACTION_NAME}}:
                                inputs:
                                  conversationId:
                                    exp: Session.ConversationId
                                  surveyId:
                                    exp: Flow.survey_id
                                  surveyName:
                                    exp: Flow.survey_name
                                  surveyVersion:
                                    exp: ToInt(Flow.survey_version)
                                  questionName:
                                    exp: Flow.question_name
                                  questionType:
                                    exp: Flow.question_type
                                  value:
                                    exp: if(IsNotSetOrEmpty(Flow.question_answer), "not answered", Flow.question_answer)
                                  isCompleted:
                                    exp: Flow.flow_is_finished
                                failureOutputs:
                                  errorCode:
                                    noValue: true
                                  status:
                                    noValue: true
                                  correlationId:
                                    noValue: true
                                  entityId:
                                    noValue: true
                                  entityName:
                                    noValue: true
                                  userMessage:
                                    noValue: true
                                  userParamsMessage:
                                    noValue: true
                                  userParams.key:
                                    noValue: true
                                  userParams.value:
                                    noValue: true
                                  details.errorCode:
                                    noValue: true
                                  details.fieldName:
                                    noValue: true
                                  details.entityId:
                                    noValue: true
                                  details.entityName:
                                    noValue: true
                        outputs:
                          failure:
                            actions:
                              - callTask:
                                  name: Call Task
                                  targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
                          timeout:
                            actions:
                              - callTask:
                                  name: Call Task
                                  targetTaskRef: "/botFlow/tasks/task[error_and_exit_120]"
                    - decision:
                        name: exit loop decision
                        condition:
                          exp: Flow.flow_is_finished
                        outputs:
                          "yes":
                            actions:
                              - loopExit:
                                  name: Exit Loop
          - communicate:
              name: Communicate
              communication:
                exp: "MakeCommunication(\n  \"Vielen Dank, dass sie sich Zeit für uns genommen haben.\")"
          - exitBotFlow:
              name: Exit Bot Flow
  settingsNaturalLanguageUnderstanding:
    nluDomainVersion:
      intents: []
      entities:
        - name: choice
          type: choice_type
        - name: comment
          type: "builtin:any"
        - name: nps
          type: nps_type
        - name: rating
          type: rating_type
      entityTypes:
        - name: choice_type
          description: The description of the Entity Type "choice_type"
          mechanism:
            type: DynamicList
        - name: nps_type
          description: The description of the Entity Type "nps_type"
          mechanism:
            type: Regex
            restricted: true
            items:
              - value: 10|[0-9]
                synonyms: []
        - name: rating_type
          description: The description of the Entity Type "rating_type"
          mechanism:
            type: DynamicList
        - name: yes_no_type
          description: The description of the Entity Type "yes_no_type"
          mechanism:
            type: DynamicList
      language: de-de
      languageVersions: {}
    mutedUtterances: []
